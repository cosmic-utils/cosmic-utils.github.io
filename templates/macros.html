{% macro project_grid(projects) %}
<div class="project-grid">
	{% for project in projects %}
	<a class="project-card" href="{{ project.repo }}">
		<div class="project-card__image">
			{% if project.image %}
			<img class="project-card__image-backdrop" src="{{ project.image }}" alt="" aria-hidden="true" loading="lazy">
			<span class="project-card__image-overlay" aria-hidden="true"></span>
			<img class="project-card__image-foreground" src="{{ project.image }}" alt="{{ project.name }} preview" loading="lazy">
			{% else %}
			<div class="project-card__placeholder" aria-hidden="true"></div>
			{% endif %}
		</div>
		<div class="project-card__body">
			<h3>{{ project.name }}</h3>
			<p>{{ project.description }}</p>
		</div>
	</a>
	{% endfor %}
</div>
{% endmacro project_grid %}
