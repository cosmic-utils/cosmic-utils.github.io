<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>{% block title %}{{ config.title }}{% endblock title %}</title>
	<meta name="description" content="{{ config.description }}">
	<link rel="icon" href="/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap">
	<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
	<header class="site-header">
		<a class="brand" href="/">
			<img class="brand__mark brand__mark--light" src="/res/cosmic-mark-neutral.svg" alt="" width="28" height="24">
			<img class="brand__mark brand__mark--dark" src="/res/cosmic-mark-white.svg" alt="" width="28" height="24">
			<span>COSMIC Utils</span>
		</a>
		<nav>
			<a href="/">Projects</a>
			<a href="/contribute/">Contribute</a>
			<a href="{{ config.extra.github_org }}">GitHub</a>
		</nav>
	</header>

	<main>
		{% block content %}{% endblock content %}
	</main>

	<footer class="site-footer">
		<p>Community-built, not affiliated with System76. COSMIC™ is a trademark of System76, Inc.</p>
		<p><a href="{{ config.extra.github_org }}">cosmic-utils on GitHub</a></p>
	</footer>
	<script src="/js/project-stars.js" defer></script>
</body>
</html>
