<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="128" height="128" viewBox="0 0 128 128">

  <defs>
    <linearGradient id="panel-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d6df"/>
      <stop offset="1" stop-color="#8099ad"/>
    </linearGradient>
    <linearGradient id="handle-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47677e"/>
      <stop offset="1" stop-color="#243b53"/>
    </linearGradient>
    <linearGradient id="red-handle-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#cd464d"/>
    </linearGradient>
  </defs>

  <g id="silhouette" inkscape:groupmode="layer" inkscape:label="Silhouette">
    <rect x="14" y="14" width="100" height="100" rx="25" fill="url(#panel-shading)"/>
  </g>

  <g id="main-detail" inkscape:groupmode="layer" inkscape:label="Main detail">
    <path d="M45 36v56m38-56v56" fill="none" stroke="#30485e"
          stroke-width="8" stroke-linecap="round"/>
    <rect x="30" y="40" width="30" height="23" rx="8" fill="url(#handle-shading)"/>
    <rect x="68" y="65" width="30" height="23" rx="8" fill="url(#red-handle-shading)"/>
    <rect x="39" y="49.5" width="12" height="4" rx="2" fill="#c5d8e5"/>
    <rect x="77" y="74.5" width="12" height="4" rx="2" fill="#ffe1dc"/>
  </g>
</svg>
